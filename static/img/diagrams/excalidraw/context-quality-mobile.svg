<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520" role="img" aria-labelledby="title desc"><title id="title">Context quality filters</title><desc id="desc">Candidate context passes through six quality checks before becoming good context.</desc><defs><filter id="r"><feTurbulence baseFrequency=".018" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/></filter><style>.i{fill:none;stroke:#343946;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:#eef0ff;stroke:#5966d0}.p{fill:#fffdfa}.l{font:600 16px system-ui,sans-serif;fill:#343946}.s{font:13px system-ui,sans-serif;fill:#5b6170}.n{font:600 14px system-ui,sans-serif;fill:#4654c7}</style></defs><rect width="390" height="520" rx="16" class="p"/><g filter="url(#r)"><text x="195" y="38" text-anchor="middle" class="n">Good Context = nhiều quality checks</text><rect x="94" y="60" width="202" height="52" rx="9" class="i p"/><text x="195" y="91" text-anchor="middle" class="l">Candidate Context</text><path d="M195 114v32M188 138l7 9 7-9" class="i"/><path d="M45 150Q195 130 345 150L320 395Q195 415 70 395Z" class="i a"/><rect x="78" y="177" width="108" height="54" rx="8" class="i p"/><text x="132" y="200" text-anchor="middle" class="l">Relevant?</text><text x="132" y="219" text-anchor="middle" class="s">đúng tín hiệu</text><rect x="204" y="177" width="108" height="54" rx="8" class="i p"/><text x="258" y="200" text-anchor="middle" class="l">Sufficient?</text><text x="258" y="219" text-anchor="middle" class="s">đủ evidence</text><rect x="78" y="250" width="108" height="54" rx="8" class="i p"/><text x="132" y="273" text-anchor="middle" class="l">Low noise?</text><text x="132" y="292" text-anchor="middle" class="s">ít thông tin rác</text><rect x="204" y="250" width="108" height="54" rx="8" class="i p"/><text x="258" y="273" text-anchor="middle" class="l">Low repeat?</text><text x="258" y="292" text-anchor="middle" class="s">ít redundancy</text><rect x="78" y="323" width="108" height="54" rx="8" class="i p"/><text x="132" y="346" text-anchor="middle" class="l">Fresh?</text><text x="132" y="365" text-anchor="middle" class="s">current state</text><rect x="204" y="323" width="108" height="54" rx="8" class="i p"/><text x="258" y="346" text-anchor="middle" class="l">Correct?</text><text x="258" y="365" text-anchor="middle" class="s">source of truth</text><path d="M195 401v28M188 421l7 9 7-9" class="i"/><rect x="91" y="435" width="208" height="56" rx="10" class="i a"/><text x="195" y="459" text-anchor="middle" class="l">Good Context</text><text x="195" y="480" text-anchor="middle" class="s">đủ tin cậy cho next decision</text></g></svg>
